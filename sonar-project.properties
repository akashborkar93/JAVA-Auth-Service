# SonarQube project configuration (single source of truth for static-analysis settings).
# Loaded by build.gradle.kts for the Gradle scanner; also valid for the standalone sonar-scanner CLI.
#
# Do NOT put sonar.host.url or sonar.token here. They are environment-specific / secret and are
# supplied at runtime via SONAR_HOST_URL (CI variable) and SONAR_TOKEN (CI secret).

sonar.projectKey=secure-auth-platform
sonar.projectName=Secure Auth Platform
sonar.sourceEncoding=UTF-8
